name: Build and Release Clyp App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - os: windows-latest
            args: --bundles nsis
          - os: ubuntu-22.04
            args: --bundles deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.CLYP_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Clyp ${{ github.ref_name }}
          releaseDraft: false
          args: ${{ matrix.args }}
