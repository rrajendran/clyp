name: Build and Release Clyp App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: windows-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build mac (ARM64)
        if: matrix.os == 'macos-latest' && matrix.arch == 'arm64'
        run: npm run build:mac -- --arm64
        env:
          GITHUB_TOKEN: ${{ secrets.CLYP_SECRET }}

      - name: Build mac (x64)
        if: matrix.os == 'macos-latest' && matrix.arch == 'x64'
        run: npm run build:mac -- --x64
        env:
          GITHUB_TOKEN: ${{ secrets.CLYP_SECRET }}

      - name: Build windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.CLYP_SECRET }}

      - name: Build linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.CLYP_SECRET }}

      - name: list dist output
        shell: bash
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "Listing workspace root:"
          ls -la
          echo "Listing dist directory (if present):"
          ls -la dist || true
          echo "Recursive find in dist:"
          find dist -maxdepth 4 -type f -exec ls -la {} \; || true

      # macOS: upload dmg (or zip the .app and upload)
      - name: Create GitHub Release (mac)
        if: matrix.os == 'macos-latest' && success()
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.CLYP_SECRET }}
        with:
          files: |
            dist/*.dmg
            # If you prefer to upload the .app bundle, zip it first and upload the zip:
            # dist/*.zip

      # Windows: upload installer/exe
      - name: Create GitHub Release (windows)
        if: matrix.os == 'windows-latest' && success()
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.CLYP_SECRET }}
        with:
          files: |
            dist/*.exe
            dist/*.msi

      # Linux: upload deb/rpm/AppImage
      - name: Create GitHub Release (linux)
        if: matrix.os == 'ubuntu-latest' && success()
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.CLYP_SECRET }}
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage